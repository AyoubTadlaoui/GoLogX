# golangci-lint config. Run with `make lint` or `golangci-lint run`.
# Reference: https://golangci-lint.run/usage/configuration/

run:
  timeout: 3m
  tests: true

linters:
  disable-all: true
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - misspell
    - gofmt
    - goimports
    - revive
    - unconvert
    - gocritic

linters-settings:
  revive:
    rules:
      - name: var-naming
      - name: package-comments
      - name: exported
      - name: unused-parameter
        disabled: true
  gocritic:
    enabled-tags:
      - performance
      - style
    disabled-checks:
      - ifElseChain
      - hugeParam

issues:
  exclude-rules:
    # Test helpers don't need the exported-symbol docs treatment.
    - path: _test\.go
      linters:
        - revive
      text: exported
    # The CLI's main.go has its own usage doc; revive's package-comments rule
    # is overzealous on command packages.
    - path: cmd/.*/main\.go
      linters:
        - revive
      text: package-comments
