name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write   # create GitHub Release + upload assets
  packages: write   # push images to ghcr.io
  id-token: write   # reserved for future cosign/keyless signing

jobs:
  goreleaser:
    name: goreleaser
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # goreleaser needs full history for the changelog

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache: true

      - name: Set up QEMU (cross-arch docker builds)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Run goreleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: '~> v2'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # PAT with `repo` scope. Reused for: homebrew-tap auto-update,
          # scoop-bucket auto-update, and the winget-pkgs fork+PR flow.
          # If unset, those pipes are skipped cleanly — the rest of the
          # release still ships. See DISTRIBUTION.md.
          HOMEBREW_TAP_GITHUB_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}
          # SSH private key registered with the maintainer's AUR account
          # (ssh aur@aur.archlinux.org). Drives the logx-bin AUR push.
          # Unset → AUR pipe is skipped cleanly. See DISTRIBUTION.md.
          AUR_KEY: ${{ secrets.AUR_KEY }}
