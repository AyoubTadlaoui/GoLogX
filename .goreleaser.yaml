# goreleaser config — https://goreleaser.com
# Local test: `make snapshot` (or `goreleaser release --snapshot --clean`).
# CI tag releases run via .github/workflows/release.yml on `v*` tags.

version: 2

project_name: GoLogX

before:
  hooks:
    - go mod tidy

builds:
  - id: logx
    main: ./cmd/logx
    binary: logx
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X main.version={{.Version}}

archives:
  - id: default
    builds: [logx]
    name_template: >-
      {{ .ProjectName }}_
      {{- .Version }}_
      {{- .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else if eq .Arch "arm64" }}arm64
      {{- else }}{{ .Arch }}{{ end }}
    format_overrides:
      - goos: windows
        format: zip
    files:
      - LICENSE
      - README.md
      - CHANGELOG.md

checksum:
  name_template: 'checksums.txt'

# Linux native packages — .deb (Debian/Ubuntu) and .rpm (RHEL/Fedora/SUSE).
# Zero new infra: they're produced by goreleaser's nfpms pipe and attached
# to the GitHub Release as additional assets. Install:
#
#   dpkg -i logx_0.2.0_amd64.deb        # Debian/Ubuntu
#   rpm -i logx-0.2.0-1.x86_64.rpm      # RHEL/Fedora/SUSE
nfpms:
  - id: logx
    package_name: logx
    file_name_template: '{{ .ConventionalFileName }}'
    builds: [logx]
    formats: [deb, rpm]
    vendor: AyoubTadlaoui
    homepage: https://github.com/AyoubTadlaoui/GoLogX
    maintainer: Ayoub Tadlaoui <atlas.kaisar@icloud.com>
    description: |-
      logx — pretty-print JSON slog logs from stdin, files, or follow mode.
      A small, zero-dependency companion CLI to the GoLogX Go library.
    license: MIT
    section: utils
    priority: optional
    bindir: /usr/bin
    contents:
      - src: LICENSE
        dst: /usr/share/doc/logx/LICENSE
      - src: README.md
        dst: /usr/share/doc/logx/README.md
      - src: CHANGELOG.md
        dst: /usr/share/doc/logx/CHANGELOG.md

# Homebrew tap — formula auto-updated on every tag.
#
# Requires a Personal Access Token (PAT) with `repo` scope on the GoLogX repo's
# secrets, exposed to the release workflow as HOMEBREW_TAP_GITHUB_TOKEN.
# See DISTRIBUTION.md for the maintainer setup.
#
# When the secret is missing the release workflow still succeeds — only the
# tap-push step fails — because we leave the GHCR + GH Release work upstream
# of this step.
brews:
  - name: logx
    repository:
      owner: AyoubTadlaoui
      name: homebrew-tap
      branch: main
      token: '{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}'
    directory: Formula
    homepage: https://github.com/AyoubTadlaoui/GoLogX
    description: Pretty-print JSON slog logs from stdin, files, or follow mode
    license: MIT
    commit_author:
      name: Ayoub Tadlaoui
      email: atlas.kaisar@icloud.com
    commit_msg_template: 'logx: bump formula to {{ .Tag }}'
    install: |
      bin.install "logx"
    test: |
      assert_match version.to_s, shell_output("#{bin}/logx -version")
    # Skip the tap push when the PAT is missing so the rest of the release
    # (GHCR + GitHub Release) still publishes cleanly. Once the secret is set,
    # future tags auto-push.
    skip_upload: '{{ if isEnvSet "HOMEBREW_TAP_GITHUB_TOKEN" }}false{{ else }}true{{ end }}'

# Scoop bucket — Windows manifest auto-updated on every tag.
# Reuses HOMEBREW_TAP_GITHUB_TOKEN (the PAT already has `repo` scope,
# which is enough to push to either AyoubTadlaoui/homebrew-tap or
# AyoubTadlaoui/scoop-bucket).
scoops:
  - name: logx
    repository:
      owner: AyoubTadlaoui
      name: scoop-bucket
      branch: main
      token: '{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}'
    directory: bucket
    homepage: https://github.com/AyoubTadlaoui/GoLogX
    description: Pretty-print JSON slog logs from stdin, files, or follow mode
    license: MIT
    commit_author:
      name: Ayoub Tadlaoui
      email: atlas.kaisar@icloud.com
    commit_msg_template: 'logx: bump scoop manifest to {{ .Tag }}'
    skip_upload: '{{ if isEnvSet "HOMEBREW_TAP_GITHUB_TOKEN" }}false{{ else }}true{{ end }}'

# AUR (Arch User Repository) — publishes the `logx-bin` binary package.
# Goreleaser builds a PKGBUILD that downloads the prebuilt Linux tarball
# from this release and installs the binary + docs into /usr/bin and
# /usr/share/doc/logx/.
#
# Maintainer setup (one-time):
#   1. Create an AUR account at https://aur.archlinux.org/register
#   2. Generate an SSH keypair just for AUR:
#        ssh-keygen -t ed25519 -C "aur" -f ~/.ssh/aur_ed25519
#   3. Paste ~/.ssh/aur_ed25519.pub into your AUR profile's "SSH Public Key"
#   4. Confirm: ssh aur@aur.archlinux.org help
#   5. Store the private key as a GoLogX repo secret:
#        gh secret set AUR_KEY --repo AyoubTadlaoui/GoLogX < ~/.ssh/aur_ed25519
#
# Until AUR_KEY is set, this pipe is skipped cleanly (release still ships
# every other channel).
aurs:
  - name: logx-bin
    homepage: https://github.com/AyoubTadlaoui/GoLogX
    description: Pretty-print JSON slog logs from stdin, files, or follow mode
    license: MIT
    maintainers:
      - 'Ayoub Tadlaoui <atlas.kaisar@icloud.com>'
    private_key: '{{ .Env.AUR_KEY }}'
    git_url: 'ssh://aur@aur.archlinux.org/logx-bin.git'
    commit_author:
      name: Ayoub Tadlaoui
      email: atlas.kaisar@icloud.com
    commit_msg_template: 'Update to {{ .Tag }}'
    package: |-
      install -Dm755 "./logx" "${pkgdir}/usr/bin/logx"
      install -Dm644 "./LICENSE" "${pkgdir}/usr/share/licenses/logx/LICENSE"
      install -Dm644 "./README.md" "${pkgdir}/usr/share/doc/logx/README.md"
      install -Dm644 "./CHANGELOG.md" "${pkgdir}/usr/share/doc/logx/CHANGELOG.md"
    skip_upload: '{{ if isEnvSet "AUR_KEY" }}false{{ else }}true{{ end }}'

# WinGet — Microsoft's official Windows package manager.
# On opt-in, goreleaser:
#   1. Generates the YAML manifest for AyoubTadlaoui.logx
#   2. Pushes it to a branch on the maintainer's fork (AyoubTadlaoui/winget-pkgs)
#   3. Opens a PR from the fork to microsoft/winget-pkgs (master)
# Microsoft auto-validates + human-reviews submissions. The first PR per
# publisher takes 1–3 days; subsequent releases often auto-merge.
#
# Opt-in gate: WINGET_SUBMIT must be set in addition to HOMEBREW_TAP_GITHUB_TOKEN.
# Rationale: WinGet expects a low submission cadence (one PR per release burst,
# not per patch tag). Auto-submitting on every `git push --tags` clogs the
# microsoft/winget-pkgs queue with stale PRs the maintainers won't merge. The
# release workflow only sets WINGET_SUBMIT when the user explicitly opts in via
# `workflow_dispatch` (see .github/workflows/release.yml).
#
# Reuses HOMEBREW_TAP_GITHUB_TOKEN (the same `repo`-scoped PAT works for
# every fork-write + PR target on github.com that you own).
winget:
  - name: logx
    publisher: AyoubTadlaoui
    publisher_url: https://github.com/AyoubTadlaoui
    publisher_support_url: https://github.com/AyoubTadlaoui/GoLogX/issues
    package_identifier: AyoubTadlaoui.logx
    license: MIT
    license_url: https://github.com/AyoubTadlaoui/GoLogX/blob/main/LICENSE
    homepage: https://github.com/AyoubTadlaoui/GoLogX
    short_description: Pretty-print JSON slog logs from stdin, files, or follow mode
    description: |
      logx is a small, zero-dependency CLI that consumes JSON slog records
      (the standard log/slog format) and renders them as colored,
      human-friendly lines. It supports stdin pipelines, file arguments,
      tail-style follow mode, level filtering, and substring grep, and
      passes through non-JSON lines unchanged so panics aren't swallowed.
    release_notes_url: 'https://github.com/AyoubTadlaoui/GoLogX/releases/tag/{{.Tag}}'
    tags: [logging, slog, cli, devtools, json]
    commit_author:
      name: Ayoub Tadlaoui
      email: atlas.kaisar@icloud.com
    commit_msg_template: 'New version: {{ .PackageIdentifier }} {{ .Version }}'
    repository:
      owner: AyoubTadlaoui
      name: winget-pkgs
      branch: 'AyoubTadlaoui.logx-{{ .Version }}'
      token: '{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}'
      pull_request:
        enabled: true
        draft: false
        base:
          owner: microsoft
          name: winget-pkgs
          branch: master
    skip_upload: '{{ if and (isEnvSet "HOMEBREW_TAP_GITHUB_TOKEN") (isEnvSet "WINGET_SUBMIT") }}false{{ else }}true{{ end }}'

# Docker / GHCR — one image per arch, joined into a multi-arch manifest.
# Repo path must be lowercase for ghcr.io: ghcr.io/ayoubtadlaoui/logx.
dockers:
  - id: logx-amd64
    image_templates:
      - 'ghcr.io/ayoubtadlaoui/logx:{{ .Version }}-amd64'
    use: buildx
    goos: linux
    goarch: amd64
    dockerfile: Dockerfile
    build_flag_templates:
      - '--pull'
      - '--platform=linux/amd64'
      - '--label=org.opencontainers.image.title={{ .ProjectName }}'
      - '--label=org.opencontainers.image.description=Pretty-print JSON slog logs'
      - '--label=org.opencontainers.image.url=https://github.com/AyoubTadlaoui/GoLogX'
      - '--label=org.opencontainers.image.source=https://github.com/AyoubTadlaoui/GoLogX'
      - '--label=org.opencontainers.image.version={{ .Version }}'
      - '--label=org.opencontainers.image.revision={{ .FullCommit }}'
      - '--label=org.opencontainers.image.licenses=MIT'
  - id: logx-arm64
    image_templates:
      - 'ghcr.io/ayoubtadlaoui/logx:{{ .Version }}-arm64'
    use: buildx
    goos: linux
    goarch: arm64
    dockerfile: Dockerfile
    build_flag_templates:
      - '--pull'
      - '--platform=linux/arm64'
      - '--label=org.opencontainers.image.title={{ .ProjectName }}'
      - '--label=org.opencontainers.image.description=Pretty-print JSON slog logs'
      - '--label=org.opencontainers.image.url=https://github.com/AyoubTadlaoui/GoLogX'
      - '--label=org.opencontainers.image.source=https://github.com/AyoubTadlaoui/GoLogX'
      - '--label=org.opencontainers.image.version={{ .Version }}'
      - '--label=org.opencontainers.image.revision={{ .FullCommit }}'
      - '--label=org.opencontainers.image.licenses=MIT'

docker_manifests:
  - name_template: 'ghcr.io/ayoubtadlaoui/logx:{{ .Version }}'
    image_templates:
      - 'ghcr.io/ayoubtadlaoui/logx:{{ .Version }}-amd64'
      - 'ghcr.io/ayoubtadlaoui/logx:{{ .Version }}-arm64'
  - name_template: 'ghcr.io/ayoubtadlaoui/logx:latest'
    image_templates:
      - 'ghcr.io/ayoubtadlaoui/logx:{{ .Version }}-amd64'
      - 'ghcr.io/ayoubtadlaoui/logx:{{ .Version }}-arm64'

snapshot:
  version_template: '{{ incpatch .Version }}-next'

changelog:
  sort: asc
  use: github
  filters:
    exclude:
      - '^docs:'
      - '^test:'
      - '^chore:'
      - 'Merge pull request'
      - 'Merge branch'

release:
  github:
    owner: AyoubTadlaoui
    name: GoLogX
  draft: false
  prerelease: auto
  name_template: '{{ .Tag }}'
  header: |
    ## GoLogX {{ .Tag }}

    Tamper-evident logging for Go: an append-only, hash-chained, optionally
    signed `log/slog` handler that `logx verify` can check, plus the everyday
    pretty-print, JSON, rotation, and fan-out. Zero external dependencies.
  footer: |
    ---

    **Install:**

    ```bash
    # Library
    go get github.com/AyoubTadlaoui/GoLogX/logx@{{ .Tag }}

    # CLI from source
    go install github.com/AyoubTadlaoui/GoLogX/cmd/logx@{{ .Tag }}

    # CLI via Homebrew (macOS / Linux)
    brew install AyoubTadlaoui/tap/logx

    # CLI via Docker (linux/amd64, linux/arm64)
    docker pull ghcr.io/ayoubtadlaoui/logx:{{ .Version }}
    ```

    Or download a prebuilt binary below.
